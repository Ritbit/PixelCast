# /etc/nginx/sites-available/PixelCast
# Nginx reverse proxy for PixelCast LED Matrix Signage
#
# Install:
#   sudo apt-get install -y nginx
#   sudo cp pixelcast.conf /etc/nginx/sites-available/PixelCast
#   sudo ln -sf /etc/nginx/sites-available/PixelCast /etc/nginx/sites-enabled/PixelCast
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS uses a self-signed certificate generated by
# deployment/scripts/generate-ssl-cert.sh (see PixelCast-ssl-cert.service).
# Browsers will show an untrusted-certificate warning — expected for a
# self-signed cert on a LAN device; the connection is still encrypted.

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/pixelcast.crt;
    ssl_certificate_key /etc/nginx/ssl/pixelcast.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 512M;

    # Serve static files directly via nginx (faster than Flask)
    location /static/ {
        alias /opt/PixelCast/led-signage/signage/web/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Custom nginx-level error pages (before Flask even sees the request)
    error_page 502 503 504 /nginx_error.html;
    location = /nginx_error.html {
        root /opt/PixelCast/led-signage/signage/web/static;
        internal;
    }

    # Proxy all other requests to Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Large uploads (video files)
        proxy_request_buffering off;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
