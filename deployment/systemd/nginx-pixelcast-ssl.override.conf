# Install as: /etc/systemd/system/nginx.service.d/pixelcast-ssl.conf
#
# Makes nginx.service wait for the self-signed TLS certificate to be in
# place before starting, so `ssl_certificate` in pixelcast.conf never
# points at a missing file on boot.
[Unit]
Requires=PixelCast-ssl-cert.service
After=PixelCast-ssl-cert.service
