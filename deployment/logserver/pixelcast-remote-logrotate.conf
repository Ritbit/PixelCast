# Logrotate policy for PixelCast remote logs (rsyslog dynaFile targets under
# /var/log/remote/<hostname>/*.log). Install as /etc/logrotate.d/pixelcast-remote
# on the log server.
/var/log/remote/*/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0600 root root
    sharedscripts
    postrotate
        /usr/bin/systemctl reload rsyslog.service >/dev/null 2>&1 || true
    endscript
}
