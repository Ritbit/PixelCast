# Receive PixelCast logs over TCP/UDP 514, one file per remote host/program.
# Installed as /etc/rsyslog.d/10-pixelcast-remote.conf by install-logserver.sh
module(load="imtcp")
input(type="imtcp" port="514")

module(load="imudp")
input(type="imudp" port="514")

template(name="RemoteHostLog" type="string"
         string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")

if ($fromhost-ip != '127.0.0.1') then {
    action(type="omfile" dynaFile="RemoteHostLog" createDirs="on")
    stop
}
